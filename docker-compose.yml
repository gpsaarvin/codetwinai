version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codetwin_postgres
    restart: always
    environment:
      POSTGRES_USER: codetwin
      POSTGRES_PASSWORD: codetwin_secret
      POSTGRES_DB: codetwin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u codetwin -d codetwin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
